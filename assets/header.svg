<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="Alejandro Acosta">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="860" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff">
        <animate attributeName="stop-color" values="#00f5ff;#ff00aa;#b026ff;#00f5ff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff00aa">
        <animate attributeName="stop-color" values="#ff00aa;#b026ff;#00f5ff;#ff00aa" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#b026ff">
        <animate attributeName="stop-color" values="#b026ff;#00f5ff;#ff00aa;#b026ff" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="860" height="200" rx="16" fill="url(#bg)"/>
  <text x="430" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="46" font-weight="700" fill="url(#neon)" filter="url(#glow)">Alejandro Acosta</text>
  <text x="430" y="118" text-anchor="middle" font-family="Consolas, JetBrains Mono, monospace" font-size="17" fill="#8b949e" letter-spacing="0.12em">FULL STACK DEVELOPER</text>
  <text x="430" y="152" text-anchor="middle" font-family="Consolas, JetBrains Mono, monospace" font-size="15" fill="#00f5ff">
    <tspan>NestJS</tspan>
    <tspan fill="#484f58"> · </tspan>
    <tspan fill="#c9d1d9">TypeScript</tspan>
    <tspan fill="#484f58"> · </tspan>
    <tspan fill="#ff00aa">GraphQL</tspan>
    <tspan fill="#484f58"> · </tspan>
    <tspan fill="#c9d1d9">PostgreSQL</tspan>
  </text>
  <rect x="280" y="168" width="300" height="2" rx="1" fill="#21262d"/>
  <rect x="280" y="168" width="80" height="2" rx="1" fill="url(#neon)">
    <animate attributeName="x" values="280;500;280" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
